name: massmusictagger

services:
  mmt:
    build:
      # This directory is the whole context. massMusicTagger is installed from
      # a pinned ref and brings discogstagger3 with it, so there are no sibling
      # checkouts to clone and no additional_contexts -- which needs Compose
      # v2.17+ and fails on older versions.
      context: .
      args:
        MMT_REF: ${MMT_REF:-v3.22.2}
    image: massmusictagger:local
    container_name: mmt
    # Fail once rather than loop.
    #
    # Docker cannot filter restarts by exit code, so unless-stopped treated a
    # refusal to start -- no config (78) or an unmounted share (69) -- exactly
    # like a crash, and retried it forever. `compose up -d` then printed
    # "Started" over a container that was really Restarting (69): the clear
    # message went to the logs and the status line said the opposite. That is
    # the same "looks healthy" failure the mount guard exists to stop.
    #
    # Neither of those conditions fixes itself, and a tagger is not a service
    # that must be up: it is started deliberately, and with source_action: move
    # an automatic restart part-way through an album is worse than stopping --
    # it would resume over half-moved files.
    #
    # The cost is no automatic recovery from a genuine mid-run crash, and none
    # on daemon start. Both are acceptable for something run by hand; if that
    # changes, the way to have both is a one-shot preflight service with
    # depends_on: condition: service_completed_successfully, leaving this one
    # unless-stopped.
    restart: "no"
    environment:
      TZ: ${TZ:-Europe/London}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Credentials via the environment, not written into the conf file.
      DISCOGS_USER_TOKEN: ${DISCOGS_USER_TOKEN:?set DISCOGS_USER_TOKEN in .env}
      # Optional: only needed for the AcoustID fingerprint tiers (6-7).
      # This is the APPLICATION key -- the submitter key is a different
      # credential and cannot stand in for it.
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      # Reserved: the AcoustID user key, for submission. Nothing reads it yet.
      ACOUSTID_SUBMITTER_KEY: ${ACOUSTID_SUBMITTER_KEY:-}
    volumes:
      # incoming and sorted are mounted as separate roots rather than the
      # library root, so the container cannot see -- let alone rewrite -- the
      # rest of the collection. Both must be writable: massMusicTagger writes
      # the done marker into the source directory and the tagged copy into
      # the destination.
      - incoming:/incoming
      - sorted:/sorted
      - archive:/archive
      - ./config:/config
      # Discogs and MusicBrainz responses. Local: it is derived data, and
      # rebuilding it costs only API calls -- though those are rate limited, so
      # it is worth keeping.
      - cache:/cache
    networks:
      - mozarr-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  mozarr-net:
    name: mozarr-net
    external: true

volumes:
  incoming:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_ADDR:?set NAS_ADDR in .env},nfsvers=4,rw,hard,intr,timeo=600
      device: ":${NAS_MUSIC_PATH:-/volume1/Music}/incoming"

  sorted:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_ADDR:?set NAS_ADDR in .env},nfsvers=4,rw,hard,intr,timeo=600
      device: ":${NAS_MUSIC_PATH:-/volume1/Music}/sorted"

  archive:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_ADDR:?set NAS_ADDR in .env},nfsvers=4,rw,hard,intr,timeo=600
      device: ":${NAS_MUSIC_PATH:-/volume1/Music}/archive"

  cache:
    driver: local

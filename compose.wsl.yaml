# WSL2 override: bind mounts instead of NFS volumes.
#
#   docker compose -f compose.yaml -f compose.wsl.yaml up -d
#
# NFS Docker volumes are blocked here by the WSL2 mount syscall restriction --
# "operation not permitted" on mount. Bind mounts onto an already-mounted
# share work instead. Run ../docker-mozarr/bootstrap/check-nfs.sh to confirm.
#
# These paths must be WRITABLE. docker-mozarr mounts the library read-only on
# purpose -- mozarr only reads -- but this writes a done marker into the
# source and the tagged copy into the destination. Mount just these
# directories read-write, leaving the rest of the library alone:
#
#   sudo bash bootstrap/mount-writable-wsl.sh incoming sorted archive

services:
  mmt:
    volumes:
      # create_host_path: false stops Docker doing what it does by default --
      # silently creating a missing bind source, so a typo in a path fails
      # instead of mounting an empty directory.
      #
      # It does NOT stop the worse case, and this comment used to claim it did.
      # The setting refuses a source that does not exist; it says nothing about
      # one that exists and is empty because the share behind it was never
      # mounted. On WSL2 these are ordinary directories until the mount script
      # runs, so the bind succeeds and the container starts healthy with nothing
      # behind it -- observed 2026-10-26 on all three at once.
      #
      # The entrypoint covers that gap: each share must carry a .mmt-mounted
      # sentinel, present exactly when the share is mounted. See require_mounts
      # in entrypoint.sh.
      - type: bind
        source: ${INCOMING_DIR:-/mnt/nas/incoming}
        target: /incoming
        bind:
          create_host_path: false
      - type: bind
        source: ${SORTED_DIR:-/mnt/nas/sorted}
        target: /sorted
        bind:
          create_host_path: false
      - type: bind
        source: ${ARCHIVE_DIR:-/mnt/nas/archive}
        target: /archive
        bind:
          create_host_path: false
      - ./config:/config
      - ./cache:/cache
